name: Build BatSign

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode
        run: |
          set -e
          # Deterministic toolchain. The newest-Xcode pick walked into an
          # xcodebuild crash inside the IDE package-graph model (26.6);
          # the 26.1/26.2 line is what this project has always built on.
          # Ordered preference, first match wins, newest stable as fallback.
          for X in Xcode_26.1.1 Xcode_26.1 Xcode_26.2 Xcode_26.2.0 Xcode_26.5; do
            if [ -d "/Applications/$X.app" ]; then SELECTED="/Applications/$X.app"; break; fi
          done
          if [ -z "$SELECTED" ]; then
            for X in $(ls -d /Applications/Xcode*.app 2>/dev/null | sort -Vr); do
              case "$(basename "$X")" in *Beta*|*beta*) continue ;; esac
              SELECTED="$X"; break
            done
          fi
          echo "Using $SELECTED"
          sudo xcode-select -s "$SELECTED/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks | grep -E "iphoneos"

      - name: Set marketing version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          agvtool new-marketing-version "${GITHUB_REF_NAME#v}"

      - name: Set build number (commit count, always increasing)
        run: |
          agvtool new-version -all "$(git rev-list --count HEAD)"

      - name: Build (unsigned, iOS device)
        run: |
          make iphoneos

      - name: Package IPA
        run: |
          ls -la packages/
          APP=$(find _build/Payload -maxdepth 1 -name "*.app" | head -1)
          echo "Built app: $APP"
          /usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print CFBundleIdentifier" "$APP/Info.plist"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BatSign-ipa
          path: packages/BatSign.ipa
          if-no-files-found: error

      - name: Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: BatSign ${{ github.ref_name }}
          files: packages/BatSign.ipa
          generate_release_notes: true
          fail_on_unmatched_files: true
